<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none" class="alishahr-map-svg">
  <defs>
    <linearGradient id="map-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="pin-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background / Land Area -->
  <rect width="600" height="420" fill="#EAEFF5"/>

  <!-- Regional Land Parcels -->
  <path d="M0 0 L220 0 L190 120 L80 180 L0 150 Z" fill="#E2E8F0" opacity="0.6"/>
  <path d="M380 0 L600 0 L600 160 L450 140 Z" fill="#E2E8F0" opacity="0.7"/>
  <path d="M420 220 L600 240 L600 420 L350 420 Z" fill="#E2E8F0" opacity="0.6"/>
  <path d="M0 260 L180 230 L160 420 L0 420 Z" fill="#E2E8F0" opacity="0.7"/>

  <!-- Bushehr Special Economic Zone (left) -->
  <rect x="15" y="160" width="80" height="85" rx="6" fill="#CBD5E1" stroke="#94A3B8" stroke-dasharray="3 3"/>
  <text x="55" y="195" font-family="Tahoma, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">منطقه ویژه</text>
  <text x="55" y="210" font-family="Tahoma, sans-serif" font-size="8" fill="#64748B" text-anchor="middle">اقتصادی بوشهر</text>

  <!-- Secondary Roads -->
  <path d="M50 40 Q180 80 240 160 T380 240 L580 290" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <path d="M50 40 Q180 80 240 160 T380 240 L580 290" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>

  <!-- Highway: Bushehr - Alishahr - Choghadak -->
  <path d="M0 170 Q140 190 280 175 T600 130" stroke="#F59E0B" stroke-width="7" opacity="0.8" stroke-linecap="round"/>
  <path d="M0 170 Q140 190 280 175 T600 130" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  
  <path d="M220 20 L240 400" stroke="#93C5FD" stroke-width="5" stroke-linecap="round"/>
  <path d="M220 20 L240 400" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Alishahr Boulevards (Main Grid) -->
  <rect x="230" y="140" width="220" height="170" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Boulevard Shohada & Boulevard Khalij Fars -->
  <line x1="230" y1="210" x2="450" y2="210" stroke="#EAB308" stroke-width="5"/>
  <line x1="230" y1="210" x2="450" y2="210" stroke="#FEF08A" stroke-width="2"/>
  
  <line x1="320" y1="140" x2="320" y2="310" stroke="#EAB308" stroke-width="5"/>
  <line x1="320" y1="140" x2="320" y2="310" stroke="#FEF08A" stroke-width="2"/>

  <!-- Town Labels -->
  <!-- Choghadak -->
  <circle cx="160" cy="55" r="7" fill="#6366F1"/>
  <circle cx="160" cy="55" r="3" fill="#FFFFFF"/>
  <text x="160" y="42" font-family="Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">چغادک (Choghadak)</text>

  <!-- Azad Gol -->
  <circle cx="340" cy="65" r="6" fill="#8B5CF6"/>
  <text x="340" y="52" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#6D28D9" text-anchor="middle">آزاد گله رپ</text>

  <!-- Tol Siah -->
  <circle cx="430" cy="85" r="5" fill="#64748B"/>
  <text x="430" y="75" font-family="Tahoma, sans-serif" font-size="9" fill="#475569" text-anchor="middle">تل سیاه (Tol Siah)</text>

  <!-- Alishahr Stadium -->
  <rect x="420" y="125" width="28" height="20" rx="4" fill="#10B981" opacity="0.8"/>
  <text x="434" y="118" font-family="Tahoma, sans-serif" font-size="9" fill="#047857" font-weight="bold" text-anchor="middle">استادیوم ورزشی عالیشهر</text>

  <!-- Gorak Klbndy -->
  <circle cx="170" cy="150" r="5" fill="#64748B"/>
  <text x="170" y="140" font-family="Tahoma, sans-serif" font-size="9" fill="#475569" text-anchor="middle">گورک کله‌بندی</text>

  <!-- Sartel -->
  <circle cx="180" cy="270" r="5" fill="#64748B"/>
  <text x="180" y="260" font-family="Tahoma, sans-serif" font-size="9" fill="#475569" text-anchor="middle">سر تل (Sartel)</text>

  <!-- Pahlavan Koshi -->
  <circle cx="270" cy="360" r="5" fill="#64748B"/>
  <text x="270" y="350" font-family="Tahoma, sans-serif" font-size="9" fill="#475569" text-anchor="middle">پهلوان‌کشی</text>

  <!-- Baghak-e Jonubi -->
  <circle cx="490" cy="255" r="5" fill="#64748B"/>
  <text x="490" y="245" font-family="Tahoma, sans-serif" font-size="9" fill="#475569" text-anchor="middle">باغک جنوبی</text>

  <!-- Highway badge -->
  <rect x="40" y="225" width="135" height="18" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="107" y="238" font-family="Tahoma, sans-serif" font-size="8" fill="#475569" text-anchor="middle">بزرگراه خلیج فارس (بوشهر - عالیشهر)</text>

  <!-- Phase labels inside Alishahr -->
  <text x="270" y="175" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#0F172A">فاز ۱ (مرکزی)</text>
  <text x="380" y="175" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#475569">فاز ۲ (لوکس)</text>
  <text x="270" y="270" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#475569">فاز ۳</text>
  <text x="380" y="270" font-family="Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#475569">فاز ۴</text>

  <!-- ADAK HEADQUARTERS PIN (Image 10 exact match) -->
  <g transform="translate(290, 175)" filter="url(#pin-shadow)">
    <!-- Pulse ring -->
    <circle cx="20" cy="20" r="22" fill="#EAB308" opacity="0.25"/>
    <!-- Outer gold ring -->
    <circle cx="20" cy="20" r="16" fill="#1E293B" stroke="#D4AF37" stroke-width="3"/>
    <!-- Star icon -->
    <polygon points="20,11 22.5,16.5 28.5,17 24,21 25.5,27 20,24 14.5,27 16,21 11.5,17 17.5,16.5" fill="#FBBF24"/>
    
    <!-- Pin Label Box -->
    <rect x="-45" y="40" width="130" height="24" rx="6" fill="#0F172A" stroke="#EAB308" stroke-width="1.5"/>
    <circle cx="-33" cy="52" r="4" fill="#EAB308"/>
    <text x="18" y="56" font-family="Tahoma, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">دفتر مرکزی املاک آداک (فاز ۱)</text>
  </g>

  <!-- Top Left Badges from Image 10 -->
  <rect x="25" y="20" width="135" height="28" rx="6" fill="#0F172A" opacity="0.92"/>
  <text x="92" y="38" font-family="Tahoma, sans-serif" font-size="9" font-weight="bold" fill="#F8FAFC" text-anchor="middle">مسیریابی در نشان و بلد</text>

  <rect x="25" y="52" width="135" height="20" rx="4" fill="#0F172A" opacity="0.85"/>
  <text x="92" y="65" font-family="monospace" font-size="8.5" fill="#FBBF24" text-anchor="middle">N 28.98° , E 51.03° :مختصات</text>

  <!-- Bottom Badges from Image 10 -->
  <rect x="20" y="375" width="95" height="22" rx="4" fill="#0F172A" opacity="0.9"/>
  <text x="67" y="390" font-family="Tahoma, sans-serif" font-size="8.5" font-weight="bold" fill="#E2E8F0" text-anchor="middle">منطقه ۱ شهری عالیشهر</text>

  <rect x="180" y="375" width="260" height="24" rx="6" fill="#0F172A" opacity="0.92" stroke="#EAB308" stroke-width="1"/>
  <text x="310" y="391" font-family="Tahoma, sans-serif" font-size="9" font-weight="bold" fill="#FDE047" text-anchor="middle">بلوار خلیج فارس، دسترسی آسان از ورودی اصلی عالیشهر</text>
</svg>
