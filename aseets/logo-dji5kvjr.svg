<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none" class="adak-brand-logo">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B48220" />
      <stop offset="100%" stop-color="#E5C05B" />
    </linearGradient>
    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2B755" />
      <stop offset="100%" stop-color="#8C6314" />
    </linearGradient>
    <radialGradient id="ruby-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </radialGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark (Architectural Caliper / Compass A) -->
  <g transform="translate(10, 4)" filter="url(#gold-glow)">
    <!-- Ruby pivot point -->
    <circle cx="30" cy="8" r="5" fill="url(#ruby-grad)"/>
    <circle cx="28.5" cy="6.5" r="1.5" fill="#FECACA" opacity="0.8"/>

    <!-- Left Leg -->
    <polygon points="30,13 36,13 22,60 14,60" fill="url(#gold-grad)"/>
    <polygon points="14,60 22,60 27,62 12,62" fill="url(#gold-dark)"/>

    <!-- Right Leg -->
    <polygon points="30,13 24,13 38,60 46,60" fill="url(#gold-grad)"/>
    <polygon points="38,60 46,60 48,62 33,62" fill="url(#gold-dark)"/>

    <!-- Central Chevron / Crossbar Support -->
    <polygon points="21,38 39,38 35,46 25,46" fill="#0F172A"/>
    <!-- Gold horizontal caliper bar -->
    <rect x="18" y="40" width="24" height="4.5" rx="1" fill="url(#gold-grad)"/>
  </g>

  <!-- Persian Brand Name: آداک -->
  <text x="80" y="34" font-family="'Vazirmatn', 'B Yekan', 'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="28" fill="url(#gold-grad)" letter-spacing="1">آداک</text>

  <!-- English Subtitle: ADAK LUXURY REAL ESTATE -->
  <text x="82" y="50" font-family="'Cinzel', 'Trajan Pro', 'Montserrat', sans-serif" font-weight="700" font-size="9" fill="#94A3B8" letter-spacing="3.2">ADAK LUXURY REAL ESTATE</text>

  <!-- Persian Tagline -->
  <text x="82" y="62" font-family="'Vazirmatn', 'B Yekan', Tahoma, sans-serif" font-weight="500" font-size="7.5" fill="#E2B755" letter-spacing="0.5" opacity="0.85">سامانه مهندسی و سرمایه‌گذاری ملکی در عالیشهر</text>
</svg>
